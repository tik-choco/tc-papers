<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#28684c" />
    <meta name="description" content="TC Papers" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TC Papers</title>
    <!-- Apply the saved theme before first paint (mirrors src/hooks/useTheme.ts). -->
    <script>
      try { if (localStorage.getItem('tc-papers:theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark') } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
